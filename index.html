<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLB Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <!-- Include three.js -->
  <script type="module" src="viewer.js"></script>
  <style>
    canvas { width: 100%; height: 100vh; display: block; }
    #controls { position: absolute; top: 10px; left: 10px; background: white; padding: 10px; }
  </style>
</head>
<body>
  <div id="controls">
    <button onclick="toggleVisibility()">Toggle Part Visibility</button>
  </div>
  
  <!-- Add the model-viewer tag -->
  <model-viewer src="model.glb" alt="3D model" auto-rotate camera-controls background-color="#FFFFFF" style="width: 100%; height: 100vh;"></model-viewer>
  
</body>
</html>
